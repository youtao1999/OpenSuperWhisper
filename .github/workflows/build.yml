name: Build Check

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install cmake libomp rust
      - name: Set up Ruby (for xcpretty)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Install xcpretty
        run: gem install xcpretty
      - name: Make run.sh executable
        run: chmod +x ./run.sh
      - name: Build with run.sh
        run: ./run.sh build
      # ditto keeps the bundle's symlinks, which upload-artifact alone would flatten
      - name: Zip app
        run: ditto -c -k --keepParent build/Build/Products/Debug/OpenSuperWhisper.app OpenSuperWhisper.zip
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: OpenSuperWhisper
          path: OpenSuperWhisper.zip 
